name: Daily database check

"on":
  schedule:
    # 08:47 IST, away from the busy start of the hour.
    - cron: '17 3 * * *'
  workflow_dispatch:

# This job only connects to the database; it needs no repository access.
permissions: {}

concurrency:
  group: daily-database-check
  cancel-in-progress: false

jobs:
  database-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Ensure PostgreSQL client is available
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi

      - name: Check database with a read-only query
        shell: bash
        env:
          # Use a Supabase Session pooler URI for GitHub's IPv4 runners.
          PGDATABASE: ${{ secrets.SUPABASE_DATABASE_URL }}
          PGCONNECT_TIMEOUT: '15'
          PGSSLMODE: require
          PGOPTIONS: '-c default_transaction_read_only=on -c statement_timeout=15000'
        run: |
          if [[ -z "$PGDATABASE" ]]; then
            echo '::error::Add the SUPABASE_DATABASE_URL repository Actions secret.'
            exit 1
          fi

          # Read an application table without printing records or changing data.
          psql -X --no-password --set=ON_ERROR_STOP=1 --quiet --tuples-only \
            --command='SELECT EXISTS (SELECT 1 FROM tasknest.tasks LIMIT 1);' >/dev/null
          echo 'Database read succeeded.'
